name: Test, publish, and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/prakhar-thecoder/cloud-run-showcase
  SERVICE_NAME: cloud-run-showcase
  REGION: us-central1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  build-and-publish:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      commit_url: ${{ steps.metadata.outputs.commit_url }}
      build_time: ${{ steps.metadata.outputs.build_time }}
      commit_message: ${{ steps.metadata.outputs.commit_message }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Calculate image metadata
        id: metadata
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "commit_url=https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          commit_message="$(git log -1 --pretty=%s | tr ',|' ';')"
          echo "commit_message=$commit_message" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.metadata.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Cloud Run
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:sha-${{ needs.build-and-publish.outputs.short_sha }}
          env_vars: |-
            COMMIT_SHA=${{ needs.build-and-publish.outputs.short_sha }}
            COMMIT_URL=${{ needs.build-and-publish.outputs.commit_url }}
            BUILD_TIME=${{ needs.build-and-publish.outputs.build_time }}
            COMMIT_MESSAGE=${{ needs.build-and-publish.outputs.commit_message }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --memory=256Mi
            --cpu=1
            --min=0
            --max=1
